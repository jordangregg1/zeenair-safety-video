<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zeenair Lounge</title>
<link rel="stylesheet" href="../shared/rotate.css">
<style>
  :root{
    --navy:#072846;
    --navy-deep:#051b32;
    --amber:#F5A623;
    --green:#3DDC84;
    --red:#E8534F;
    --line:rgba(255,255,255,0.12);
    --text-dim:rgba(255,255,255,0.55);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  /* ===== STAGE: exact 1920x1080 landscape frame the projector/capture sees ===== */
  .stage{
    width:1920px;
    height:1080px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* ===== BOARD: portrait content (1080x1920), rotated to fill the landscape stage ===== */
  .board{
    width:1080px;
    height:1920px;
    background:var(--navy);
    transform: rotate(var(--board-rotate));
    transform-origin: center center;
    color:#fff;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .board::after{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.09) 0px, rgba(0,0,0,0.09) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%);
    pointer-events:none;
  }

  /* ---------- header ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:56px 64px 28px 64px;
  }
  .logo-wrap img{ height:128px; width:auto; display:block; filter:brightness(0) saturate(100%) invert(1); }
  .header-right{ text-align:right; }
  .clock{
    font-family:"SF Mono","Consolas","Menlo",monospace;
    font-size:44px;
    letter-spacing:2px;
    color:var(--text-dim);
  }

  .divider{
    height:2px;
    margin:0 64px;
    background:linear-gradient(90deg, var(--amber) 0%, rgba(245,166,35,0.15) 100%);
  }

  /* ---------- lounge board image ---------- */
  .lounge-wrap{
    flex:1;
    padding:0 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .lounge-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  /* ---------- footer ---------- */
  .footer{
    padding:26px 64px 46px 64px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-top:2px solid var(--line);
  }
  .footer-tag{ font-size:22px; color:var(--amber); letter-spacing:2px; font-weight:700; }
</style>
</head>

  function updateClock(){

    const m = now.getMinutes().toString().padStart(2,"0");
