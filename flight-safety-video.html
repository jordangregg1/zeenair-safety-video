<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Safety Video</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #scrub-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #scrub-bar.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #scrub-bar input[type="range"] {
      flex: 1;
      cursor: pointer;
    }
    #play-pause {
      flex: none;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
    }
    #play-pause:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    #settings-toggle {
      flex: none;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
    }
    #settings-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    #settings-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    #config-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }
    #config-overlay.visible {
      display: flex;
    }
    #config-panel {
      background: #1c1c1e;
      color: #fff;
      border-radius: 12px;
      padding: 24px 28px;
      width: min(320px, 80vw);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    #config-panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 600;
    }
    #config-panel label {
      display: block;
      font-size: 13px;
      color: #ccc;
      margin-bottom: 6px;
    }
    #loop-delay-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    #loop-delay-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2c2c2e;
      color: #fff;
      font-size: 14px;
    }
    .config-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
    }
    .config-toggle-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    #config-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    #config-buttons button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    #config-close {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    #config-close:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    #reboot-timer {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 15;
      width: 30px;
      height: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #reboot-timer.visible {
      opacity: 0.55;
    }
    #reboot-timer svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    #reboot-timer circle {
      fill: none;
      stroke-width: 2;
    }
    #reboot-timer-track {
      stroke: rgba(255, 255, 255, 0.25);
    }
    #reboot-timer-progress {
      stroke: #fff;
      stroke-linecap: round;
    }
    #reboot-timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 10px;
      font-weight: 500;
    }
    #restart-button {
      position: fixed;
      left: 50%;
      top: 78%;
      transform: translate(-50%, -50%) scale(0.96);
      z-index: 15;
      padding: 32px 64px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      color: #0a2540;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 36px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #restart-button.visible {
      opacity: 0.75;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    #restart-button:hover {
      background: #fff;
    }
  </style>
</head>
<body>
  <video id="bg-video" autoplay playsinline style="width:100vw;height:100vh;object-fit:cover;">
    <source src="Zeenair Flight Safety Video - trimmed.mov">
  </video>
  <div id="scrub-bar">
    <button id="play-pause" type="button" aria-label="Pause">⏸</button>
    <input type="range" id="scrubber" min="0" max="100" step="0.01" value="0">
    <button id="settings-toggle" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.4 7.4 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.62 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.07.63-.07.94s.02.63.06.94L2.74 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.47 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/>
      </svg>
    </button>
  </div>
  <div id="reboot-timer">
    <svg viewBox="0 0 30 30">
      <circle id="reboot-timer-track" cx="15" cy="15" r="13"></circle>
      <circle id="reboot-timer-progress" cx="15" cy="15" r="13"></circle>
    </svg>
    <div id="reboot-timer-text"></div>
  </div>
  <button id="restart-button" type="button">Start Flight Safety Video</button>
  <div id="config-overlay">
    <div id="config-panel">
      <h2>Settings</h2>
      <label for="loop-delay-input">Loop delay (seconds)</label>
      <div id="loop-delay-row">
        <input type="number" id="loop-delay-input" min="0" step="1" value="30">
      </div>
      <label class="config-toggle-row" for="reboot-timer-toggle">
        <input type="checkbox" id="reboot-timer-toggle">
        <span>Show reboot countdown timer</span>
      </label>
      <label class="config-toggle-row" for="restart-button-toggle">
        <input type="checkbox" id="restart-button-toggle">
        <span>Show restart button</span>
      </label>
      <div id="config-buttons">
        <button id="config-close" type="button">Close</button>
      </div>
    </div>
  </div>
  <script src="shared/back-to-menu.js"></script>
  <script>
    const video = document.getElementById('bg-video');
    const scrubber = document.getElementById('scrubber');
    const scrubBar = document.getElementById('scrub-bar');
    const playPauseBtn = document.getElementById('play-pause');
    let dragging = false;
    let hideTimer = null;

    const showControls = () => {
      scrubBar.classList.add('visible');
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!dragging) scrubBar.classList.remove('visible');
      }, 5000);
    };

    ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, showControls, { passive: true });
    });
    showControls();

    video.addEventListener('loadedmetadata', () => {
      scrubber.max = video.duration;
    });

    // Browsers block autoplay with sound unless the user already interacted
    // with the page. Try unmuted first; if that's rejected, fall back to a
    // muted autoplay and unmute on the first interaction anywhere on the page.
    video.play().catch(() => {
      video.muted = true;
      video.play();
      const unmuteOnFirstInteraction = () => {
        video.muted = false;
      };
      ['click', 'touchstart', 'keydown'].forEach(evt => {
        document.addEventListener(evt, unmuteOnFirstInteraction, { once: true, passive: true });
      });
    });

    video.addEventListener('timeupdate', () => {
      if (!dragging) scrubber.value = video.currentTime;
    });

    const unmuteOnInteract = () => { video.muted = false; };

    const updatePlayPauseIcon = () => {
      playPauseBtn.textContent = video.paused ? '▶' : '⏸';
      playPauseBtn.setAttribute('aria-label', video.paused ? 'Play' : 'Pause');
    };

    playPauseBtn.addEventListener('click', () => {
      unmuteOnInteract();
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
      showControls();
    });

    video.addEventListener('play', updatePlayPauseIcon);
    video.addEventListener('pause', updatePlayPauseIcon);

    scrubber.addEventListener('pointerdown', () => {
      dragging = true;
      unmuteOnInteract();
      showControls();
    });

    scrubber.addEventListener('input', () => {
      video.currentTime = scrubber.value;
    });

    scrubber.addEventListener('pointerup', () => {
      dragging = false;
      showControls();
    });

    // --- Configuration menu (loop delay) ---
    const LOOP_DELAY_KEY = 'zeenair-loop-delay-seconds';
    const DEFAULT_LOOP_DELAY = 30;

    const REBOOT_TIMER_ENABLED_KEY = 'zeenair-reboot-timer-enabled';
    const RESTART_BUTTON_ENABLED_KEY = 'zeenair-restart-button-enabled';

    const configOverlay = document.getElementById('config-overlay');
    const configClose = document.getElementById('config-close');
    const loopDelayInput = document.getElementById('loop-delay-input');
    const rebootTimerToggle = document.getElementById('reboot-timer-toggle');
    const restartButtonToggle = document.getElementById('restart-button-toggle');
    const settingsToggle = document.getElementById('settings-toggle');

    const getLoopDelay = () => {
      const stored = parseFloat(localStorage.getItem(LOOP_DELAY_KEY));
      return Number.isFinite(stored) && stored >= 0 ? stored : DEFAULT_LOOP_DELAY;
    };

    const setLoopDelay = (seconds) => {
      localStorage.setItem(LOOP_DELAY_KEY, String(seconds));
    };

    const isRebootTimerEnabled = () => localStorage.getItem(REBOOT_TIMER_ENABLED_KEY) !== 'false';

    const setRebootTimerEnabled = (enabled) => {
      localStorage.setItem(REBOOT_TIMER_ENABLED_KEY, String(enabled));
    };

    const isRestartButtonEnabled = () => localStorage.getItem(RESTART_BUTTON_ENABLED_KEY) !== 'false';

    const setRestartButtonEnabled = (enabled) => {
      localStorage.setItem(RESTART_BUTTON_ENABLED_KEY, String(enabled));
    };

    loopDelayInput.value = getLoopDelay();
    rebootTimerToggle.checked = isRebootTimerEnabled();
    restartButtonToggle.checked = isRestartButtonEnabled();

    const openConfig = () => {
      loopDelayInput.value = getLoopDelay();
      rebootTimerToggle.checked = isRebootTimerEnabled();
      restartButtonToggle.checked = isRestartButtonEnabled();
      configOverlay.classList.add('visible');
    };

    const closeConfig = () => {
      const parsed = parseFloat(loopDelayInput.value);
      if (Number.isFinite(parsed) && parsed >= 0) {
        setLoopDelay(parsed);
      }
      setRebootTimerEnabled(rebootTimerToggle.checked);
      setRestartButtonEnabled(restartButtonToggle.checked);
      if (!isRestartButtonEnabled()) restartButton.classList.remove('visible');
      configOverlay.classList.remove('visible');
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'c' || e.key === 'C') {
        if (configOverlay.classList.contains('visible')) {
          closeConfig();
        } else {
          openConfig();
        }
      }
    });

    configClose.addEventListener('click', closeConfig);

    // Gear icon in the playback controls bar opens config; it fades with
    // the rest of the controls when idle, and reappears with them on touch.
    settingsToggle.addEventListener('click', () => {
      unmuteOnInteract();
      openConfig();
      showControls();
    });

    // Loop with a configurable delay instead of looping instantly.
    let loopTimer = null;

    const rebootTimerEl = document.getElementById('reboot-timer');
    const rebootTimerProgress = document.getElementById('reboot-timer-progress');
    const rebootTimerText = document.getElementById('reboot-timer-text');
    const REBOOT_RING_RADIUS = 13;
    const REBOOT_RING_CIRCUMFERENCE = 2 * Math.PI * REBOOT_RING_RADIUS;
    rebootTimerProgress.style.strokeDasharray = String(REBOOT_RING_CIRCUMFERENCE);
    let rebootAnimFrame = null;

    // The countdown itself always runs while waiting to re-loop; only its
    // visibility is gated by the "enabled" setting, re-checked every frame
    // so toggling the checkbox takes effect immediately, live.
    const stopRebootTimer = () => {
      if (rebootAnimFrame) {
        cancelAnimationFrame(rebootAnimFrame);
        rebootAnimFrame = null;
      }
      rebootTimerEl.classList.remove('visible');
    };

    const startRebootTimer = (delaySeconds) => {
      const startedAt = performance.now();
      const durationMs = delaySeconds * 1000;

      const tick = (now) => {
        rebootTimerEl.classList.toggle('visible', isRebootTimerEnabled());

        const elapsed = now - startedAt;
        const remainingMs = Math.max(0, durationMs - elapsed);
        const fraction = durationMs > 0 ? elapsed / durationMs : 1;
        rebootTimerProgress.style.strokeDashoffset = String(REBOOT_RING_CIRCUMFERENCE * Math.min(1, fraction));
        rebootTimerText.textContent = String(Math.ceil(remainingMs / 1000));
        if (remainingMs > 0) {
          rebootAnimFrame = requestAnimationFrame(tick);
        } else {
          rebootTimerEl.classList.remove('visible');
        }
      };
      rebootAnimFrame = requestAnimationFrame(tick);
    };

    const restartButton = document.getElementById('restart-button');

    const restartVideo = () => {
      if (loopTimer) clearTimeout(loopTimer);
      stopRebootTimer();
      restartButton.classList.remove('visible');
      video.currentTime = 0;
      video.play();
    };

    video.addEventListener('ended', () => {
      const delay = getLoopDelay();
      if (loopTimer) clearTimeout(loopTimer);
      if (delay > 0) startRebootTimer(delay);
      restartButton.classList.toggle('visible', isRestartButtonEnabled());
      loopTimer = setTimeout(() => {
        video.currentTime = 0;
        video.play();
      }, delay * 1000);
    });

    video.addEventListener('play', stopRebootTimer);
    video.addEventListener('play', () => restartButton.classList.remove('visible'));
    restartButton.addEventListener('click', restartVideo);

    rebootTimerToggle.addEventListener('change', () => {
      setRebootTimerEnabled(rebootTimerToggle.checked);
    });

    restartButtonToggle.addEventListener('change', () => {
      setRestartButtonEnabled(restartButtonToggle.checked);
      if (video.ended) {
        restartButton.classList.toggle('visible', restartButtonToggle.checked);
      }
    });
  </script>
</body>
</html>
